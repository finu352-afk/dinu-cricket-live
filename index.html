<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Cricket Live | Dinu</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh;display:flex;flex-direction:column}
    .top{padding:16px 18px 0}
    .join{display:inline-flex;align-items:center;gap:12px;padding:12px 18px;border-radius:18px;
      background:linear-gradient(110deg,#2498e8,#1767c7);color:#fff;text-decoration:none;font-weight:700;
      min-height:68px;box-shadow:0 2px 8px #0008}
    .tg{width:44px;height:44px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center}
    .tg svg{width:25px;height:25px;fill:#fff}
    .ad-space{height:min(36vh,350px);min-height:160px}
    .player-wrap{width:100%;background:#000;position:relative;aspect-ratio:16/9;display:grid;place-items:center}
    video{width:100%;height:100%;object-fit:contain;background:#000}
    .status{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;color:#ddd;
      font-size:13px;text-shadow:0 1px 3px #000;pointer-events:none}
    .float{position:fixed;right:18px;bottom:22%;width:58px;height:58px;border-radius:50%;
      background:#229ed9;border:4px solid #555;display:grid;place-items:center;z-index:5;box-shadow:0 2px 10px #0009}
    .float svg{width:30px;height:30px;fill:#fff}
    .note{max-width:760px;margin:20px auto;padding:0 16px;color:#aaa;font-size:13px;line-height:1.5}
    footer{margin-top:auto;padding:22px 12px 18px;text-align:center;color:#888;font-size:13px;letter-spacing:.3px}
    footer strong{color:#fff;font-weight:700}
    @media(min-width:800px){.player-wrap{max-width:1100px;margin:0 auto}}
  </style>
</head>
<body>
  <header class="top">
    <a class="join" href="https://t.me/dinusaranlive" target="_blank" rel="noopener">
      <span class="tg" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M21.7 4.3 18.6 19c-.2 1-.8 1.2-1.6.7l-4.5-3.3-2.2 2.1c-.2.2-.4.4-.8.4l.3-4.6 8.4-7.6c.4-.3-.1-.5-.6-.2L7.2 13.2l-4.4-1.4c-1-.3-1-1 .2-1.5L20 4c.8-.3 1.9.2 1.7.3Z"/></svg>
      </span>
      Join @Dinusaranlive
    </a>
  </header>
  <div class="ad-space" aria-hidden="true"></div>
  <main>
    <section class="player-wrap" aria-label="Live video player">
      <video id="liveVideo" controls playsinline muted autoplay></video>
      <div class="status" id="status">अधिकृत Live Stream URL जोड़ने के बाद वीडियो यहाँ चलेगा।</div>
    </section>
    <p class="note">लाइव प्रसारण के लिए अपने अधिकृत प्रदाता से मिला HLS (.m3u8) URL जोड़ें। मोबाइल ब्राउज़र आवाज़ के साथ ऑटो-प्ले रोक सकते हैं; इसलिए वीडियो muted शुरू होता है।</p>
  </main>
  <a class="float" href="https://t.me/Cricinsider365" target="_blank" rel="noopener" aria-label="Telegram">
    <svg viewBox="0 0 24 24"><path d="M21.7 4.3 18.6 19c-.2 1-.8 1.2-1.6.7l-4.5-3.3-2.2 2.1c-.2.2-.4.4-.8.4l.3-4.6 8.4-7.6c.4-.3-.1-.5-.6-.2L7.2 13.2l-4.4-1.4c-1-.3-1-1 .2-1.5L20 4c.8-.3 1.9.2 1.7.3Z"/></svg>
  </a>
  <footer>Designed &amp; Managed by <strong>Dinu</strong></footer>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    // केवल अपने अधिकृत प्रदाता का HLS URL यहाँ डालें।
    const STREAM_URL = "";
    const video = document.getElementById("liveVideo");
    const status = document.getElementById("status");
    if (!STREAM_URL) {
      status.textContent = "Live Stream अभी कॉन्फ़िगर नहीं है। अधिकृत Provider का URL आवश्यक है।";
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = STREAM_URL;
      video.play().catch(() => status.textContent = "वीडियो चलाने के लिए Play दबाएँ।");
    } else if (window.Hls && Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(STREAM_URL);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => status.textContent = "वीडियो चलाने के लिए Play दबाएँ।"));
      hls.on(Hls.Events.ERROR, (_, data) => { if (data.fatal) status.textContent = "स्ट्रीम उपलब्ध नहीं है या Provider ने अनुरोध अस्वीकार किया है।"; });
    } else {
      status.textContent = "यह ब्राउज़र इस स्ट्रीम फॉर्मेट को सपोर्ट नहीं करता।";
    }
  </script>
</body>
</html>
